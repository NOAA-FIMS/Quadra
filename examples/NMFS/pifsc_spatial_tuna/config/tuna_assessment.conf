# Quadra tuna assessment runtime configuration.
# Precedence: compiled defaults < this file < QUADRA_TUNA_* environment.

[run]
run.baseline_only = true

[output]
output.data_dir = build/assessment_outputs/data
output.report_dir = build/assessment_outputs/report

[data]
data.model_consistent = true

[model]
model.anchor_fleet = 1
model.use_priors = true
model.use_composition = true
model.estimate_availability_scales = false
model.availability_by_fleet_only = true
model.share_movement_across_seasons = true
model.movement_smoothing = 2.0
model.availability_smoothing = 1.5
model.retention_prior_sd_multiplier = 1.0

[fit]
fit.load_checkpoint = false
fit.multistart = 1
fit.max_phase_iterations = 100
fit.initial_step = 0.15
fit.min_step = 1e-8
fit.seed = 20260724
fit.hdot_workers = 0
fit.print_every = 1
fit.direct_full = false

[sampling]
sampling.enabled = false
# pCN is the clean-checkout default because it needs no pre-trained artifact.
# After producing pilot draws and running `make train-transport-flow`, switch to
# `transport_isir` to use the native nonlinear proposal ensemble.
sampling.method = pcn
sampling.chains = 4
sampling.warmup = 250
sampling.samples = 1000
sampling.max_tree_depth = 8
sampling.target_acceptance = 0.8
sampling.initial_step_size = 0.05
sampling.adapt_mass = false
sampling.dense_metric = false
# Chains already run concurrently. Increase only when running fewer chains and
# benchmarking shows spare physical CPU capacity.
sampling.gradient_workers = 1
sampling.newton_initial_step = 1.0
sampling.parallel_chains = true
sampling.tape_rebuild_interval = 1
# Exact preconditioned Crank-Nicolson Metropolis proposal in the Laplace-
# whitened coordinates. Warmup adapts beta, then freezes it for sampling.
sampling.pcn_beta = 0.5
sampling.pcn_target_acceptance = 0.3
sampling.pcn_adapt_beta = false
sampling.proposal_draws = build/assessment_outputs/data/posterior_draws.csv
sampling.proposal_df = 8.0
sampling.proposal_inflation = 1.2
sampling.proposal_global_weight = 0.9
sampling.proposal_local_scale = 0.2
sampling.proposal_rw_scale = 0.2
sampling.transport_components = 6
sampling.transport_inflation = 1.1
sampling.transport_shrinkage = 0.15
sampling.transport_bandwidth = 0.05
sampling.transport_ridge = 0.05
sampling.transport_model = build/transport_flow/native_realnvp_20260823.qflow
sampling.transport_models = build/transport_flow/native_realnvp_20260823.qflow,build/transport_flow/native_realnvp_20260824.qflow,build/transport_flow/native_realnvp_20260825.qflow,build/transport_flow/native_realnvp_20260826.qflow
# Candidate pool for exact iterated sampling-importance-resampling. Larger
# pools reduce sticky importance-weight tails at a linear evaluation cost.
sampling.transport_candidates = 8
sampling.management_draws = 50

[simulation]
simulation.observation_sd_multiplier = 1.0
simulation.composition_effective_n = 8.09
