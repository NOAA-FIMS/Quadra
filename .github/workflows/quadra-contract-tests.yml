name: quadra-contract-tests

on:
  push:
  pull_request:

jobs:
  big-laplace-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run big Laplace convergence contract
        run: |
          chmod +x tests/run_big_laplace_convergence_contract.sh
          ./tests/run_big_laplace_convergence_contract.sh
