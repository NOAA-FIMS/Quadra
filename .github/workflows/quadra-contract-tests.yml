name: quadra-contract-tests

on:
  push:
  pull_request:

jobs:
  big-laplace-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - name: Debug Quadra API state
        run: |
          pwd
          git status --short
          git log -1 --oneline
          c++ --version
          grep -n "struct LaplaceOptions" -A35 core/laplace.hpp
          grep -n "iprint\|grad_tol\|max_iterations\|random_effects_m\|solve_random_effects_laplace" \
            core/optimizer.hpp examples/big/catch_at_age_laplace.cpp core/laplace.hpp || true
          ls -l tests/run_big_laplace_convergence_contract.sh
      - name: Run big Laplace convergence contract
        run: |
          chmod +x tests/run_big_laplace_convergence_contract.sh
          ./tests/run_big_laplace_convergence_contract.sh
